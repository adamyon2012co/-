[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wholesome-shorts"
version = "0.1.0"
description = "Local-first production workflow for original wholesome YouTube Shorts"
requires-python = ">=3.11"
dependencies = ["imageio-ffmpeg>=0.5,<1"]

[project.scripts]
wholesome-shorts = "wholesome_shorts.cli:main"

[tool.setuptools.packages.find]
include = ["wholesome_shorts*"]
